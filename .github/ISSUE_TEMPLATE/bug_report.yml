name: Bug report
description: Report a reproducible benchmark, CLI, or documentation defect.
title: "bug: "
labels: ["bug", "integrity"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private artifact bundles, or evaluator-only gold evidence.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.1.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the exact command, platform, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
