name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  verify-build:
    name: Verify and build release artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps .
      - name: Run release verification gates
        run: |
          python -m pytest -q --cov=radar_bench --cov-fail-under=90
          python -m ruff check .
          python -m mypy --strict src
          python -m bandit -q -r src scripts
          python -m pip_audit .
          python -m radar_bench.cli validate --suite decisive-v1.1
          python -m radar_bench.cli verify-results reference/decisive-v1.1-result.json
          python scripts/audit_metadata_only.py --output "$RUNNER_TEMP/metadata-only-inference.json"
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/radar-dist"
      - name: Create checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/radar-dist"
          sha256sum radar_bench-1.0.1-py3-none-any.whl radar_bench-1.0.1.tar.gz > SHA256SUMS
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-bench-release-artifacts
          path: ${{ runner.temp }}/radar-dist
          if-no-files-found: error
          retention-days: 7
      - name: Require a clean checkout after generators
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  draft-release:
    name: Create draft release from verified artifacts
    needs: verify-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download only verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: radar-bench-release-artifacts
          path: ${{ runner.temp }}/radar-dist
      - name: Verify artifact checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/radar-dist"
          sha256sum --check SHA256SUMS
      - name: Create draft release without moving the tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.1 \
            "$RUNNER_TEMP/radar-dist/radar_bench-1.0.1-py3-none-any.whl" \
            "$RUNNER_TEMP/radar-dist/radar_bench-1.0.1.tar.gz" \
            --draft --verify-tag --title "Radar Bench v1.0.1" \
            --notes "Draft only. Publish after independent review of the fail-closed release evidence."
