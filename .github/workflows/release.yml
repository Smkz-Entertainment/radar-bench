name: Release verification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable tag to verify; no tag is created or moved"
        required: true
        default: "v1.1.1"
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  verify-build:
    name: Verify immutable tag and build artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Require the exact existing tag target
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          test "$RELEASE_TAG" = "v1.1.1"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps .
      - name: Require package version to equal the tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${RELEASE_TAG#v}"
      - name: Run release verification gates
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage json -o "$RUNNER_TEMP/coverage.json"
          python scripts/check_coverage.py "$RUNNER_TEMP/coverage.json"
          python -m ruff check .
          python -m mypy --strict src
          python -m bandit -q -r src scripts
          python -m pip_audit .
          python -m pip install --disable-pip-version-check cffconvert==2.0.0
          cffconvert --validate -i CITATION.cff
          python -m radar_bench.cli validate --suite decisive-v1.1
          python -m radar_bench.cli validate --suite decisive-v1.2
          python -m radar_bench.cli verify-results reference/decisive-v1.1-result.json
      - name: Reconstruct and verify decisive v1.2 artifacts
        shell: bash
        run: |
          python -m radar_bench.cli artifacts fetch --suite decisive-v1.2 --output-root "$RUNNER_TEMP/radar-artifacts"
          python -m radar_bench.cli artifacts verify --suite decisive-v1.2 --artifact-root "$RUNNER_TEMP/radar-artifacts"
      - name: Run real external protocol experiment smoke
        run: python scripts/run_protocol_smoke.py --artifact-root "$RUNNER_TEMP/radar-artifacts" --output "$RUNNER_TEMP/protocol-smoke.json"
      - name: Upload protocol smoke receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/protocol-smoke.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/radar-dist"
      - name: Prepare and audit release assets
        run: |
          python scripts/prepare_release_assets.py --dist "$RUNNER_TEMP/radar-dist" --release-tag "${{ inputs.release_tag }}"
          python scripts/audit_release_assets.py "$RUNNER_TEMP/radar-dist"
      - name: Verify prepared provenance and evaluator asset
        run: python scripts/audit_release_assets.py "$RUNNER_TEMP/radar-dist"
      - name: Verify public package contents
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path(os.environ["RUNNER_TEMP"]) / "radar-dist"
          forbidden = (
              "/resources/reference/",
              "/resources/baselines/",
              "/resources/evaluator/",
              "/evaluator/decisive-v1.2/",
              "/evaluator-bundle.json/",
              "/evaluator-labels.json/",
              "/safety-twins/views/",
          )
          required_public = (
              "/resources/corpus/v1.0.1/decisive-v1.1/reproducers/",
              "/resources/corpus/v1.0.1/safety-twins/runtime/",
          )
          for archive in dist.iterdir():
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as handle:
                      names = handle.namelist()
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive, "r:gz") as handle:
                      names = handle.getnames()
              else:
                  continue
              lowered = ["/" + name.lower().replace("\\", "/") + "/" for name in names]
              assert not any(any(token in name for token in forbidden) for name in lowered), archive
              assert all(any(token in name for name in lowered) for token in required_public), archive
              assert any("decisive-v1.2" in name for name in lowered), archive
          PY
      - name: Verify package checksums and provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd "$RUNNER_TEMP/radar-dist"
          test -f "radar_bench-${RELEASE_TAG#v}-py3-none-any.whl"
          test -f "radar_bench-${RELEASE_TAG#v}.tar.gz"
          test -f SOURCE-PROVENANCE.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(Path("SOURCE-PROVENANCE.json").read_text(encoding="utf-8"))
          assert provenance["release_tag"] == os.environ["RELEASE_TAG"]
          assert provenance["package_version"] == os.environ["RELEASE_TAG"].removeprefix("v")
          assert len(provenance["source_commit"]) == 40
          assert len(provenance["source_tree"]) == 40
          PY
          sha256sum --check SHA256SUMS
      - name: Attest wheel
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/radar-dist/radar_bench-1.1.1-py3-none-any.whl
      - name: Attest sdist
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/radar-dist/radar_bench-1.1.1.tar.gz
      - name: Attest evaluator asset
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/radar-dist/radar-bench-decisive-v1.2-evaluator.json
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-bench-v1.1.1-release-assets
          path: ${{ runner.temp }}/radar-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Require a clean checkout after verification
        run: git diff --exit-code && test -z "$(git status --porcelain)"
