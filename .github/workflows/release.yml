name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  verify-build:
    name: Verify and build release artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps .
      - name: Run release verification gates
        run: |
          python -m pytest -q --cov=radar_bench --cov-fail-under=90
          python -m ruff check .
          python -m mypy --strict src
          python -m bandit -q -r src scripts
          python -m pip_audit .
          python -m pip install --disable-pip-version-check cffconvert==2.0.0
          cffconvert --validate -i CITATION.cff
          python -m radar_bench.cli validate --suite decisive-v1.1
          python -m radar_bench.cli verify-results reference/decisive-v1.1-result.json
          python scripts/audit_metadata_only.py --output "$RUNNER_TEMP/metadata-only-inference.json"
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/radar-dist"
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
      - name: Scan checkout and release archives with Gitleaks
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks-current.json"
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all' --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/radar-dist" --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks-package.json"
      - name: Install pinned TruffleHog
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/trufflehog.tar.gz"
          echo "7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP"
      - name: Scan checkout and release archives with TruffleHog
        shell: bash
        run: |
          # URI/Lob are excluded only for documented inert URL/name fixtures.
          "$RUNNER_TEMP/trufflehog" filesystem . --json --no-update --no-color --results=verified --exclude-detectors=URI,Lob --fail --fail-on-scan-errors
          "$RUNNER_TEMP/trufflehog" git file://"$GITHUB_WORKSPACE" --json --no-update --no-color --results=verified --exclude-detectors=URI,Lob --fail --fail-on-scan-errors
          "$RUNNER_TEMP/trufflehog" filesystem "$RUNNER_TEMP/radar-dist" --json --no-update --no-color --results=verified --exclude-detectors=URI,Lob --fail --fail-on-scan-errors
      - name: Create checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/radar-dist"
          sha256sum radar_bench-1.0.1-py3-none-any.whl radar_bench-1.0.1.tar.gz > SHA256SUMS
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-bench-release-artifacts
          path: ${{ runner.temp }}/radar-dist
          if-no-files-found: error
          retention-days: 7
      - name: Require a clean checkout after generators
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  draft-release:
    name: Create draft release from verified artifacts
    needs: verify-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download only verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: radar-bench-release-artifacts
          path: ${{ runner.temp }}/radar-dist
      - name: Verify artifact checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/radar-dist"
          sha256sum --check SHA256SUMS
      - name: Create draft release without moving the tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.1 \
            "$RUNNER_TEMP/radar-dist/radar_bench-1.0.1-py3-none-any.whl" \
            "$RUNNER_TEMP/radar-dist/radar_bench-1.0.1.tar.gz" \
            --draft --verify-tag --title "Radar Bench v1.0.1" \
            --notes "Draft only. Publish after independent review of the fail-closed release evidence."
