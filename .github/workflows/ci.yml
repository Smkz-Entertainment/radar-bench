name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps .
      - name: Run tests and separate coverage gates
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage json -o "$RUNNER_TEMP/coverage.json"
          python scripts/check_coverage.py "$RUNNER_TEMP/coverage.json"
      - name: Run lint
        run: python -m ruff check .
      - name: Run type checking
        run: python -m mypy --strict src
      - name: Run security lint
        run: python -m bandit -q -r src scripts
      - name: Run dependency audit
        run: python -m pip_audit .

  contract:
    name: Strict contract and package smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Validate canonical suite and reference contract
        run: |
          python -m pip install --no-deps .
          python -m radar_bench.cli validate --suite decisive-v1.1
          python -m radar_bench.cli verify-results reference/decisive-v1.1-result.json
          python scripts/audit_metadata_only.py --output "$RUNNER_TEMP/metadata-only-inference.json"
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/radar-dist"
      - name: Prepare and audit release assets
        run: |
          python scripts/prepare_release_assets.py --dist "$RUNNER_TEMP/radar-dist" --release-tag v1.1.1
          python scripts/audit_release_assets.py "$RUNNER_TEMP/radar-dist"
      - name: Check current public state and local links
        run: |
          python scripts/check_public_state.py
          python scripts/check_links.py
      - name: Smoke-test installed wheel from empty directory
        shell: bash
        run: |
          SMOKE="$RUNNER_TEMP/radar-smoke"
          mkdir -p "$SMOKE"
          python -m venv "$SMOKE/venv"
          "$SMOKE/venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/radar-dist/*.whl
          cd "$SMOKE"
          "$SMOKE/venv/bin/radar-bench" doctor
          "$SMOKE/venv/bin/radar-bench" list-suites
          set +e
          OUTPUT=$("$SMOKE/venv/bin/radar-bench" validate --suite decisive-v1.2 2>&1)
          CODE=$?
          set -e
          test "$CODE" -eq 2
          echo "$OUTPUT" | grep -q 'BLOCKED_INFORMATION_SUFFICIENCY'
      - name: Smoke-test installed sdist from empty directory
        shell: bash
        run: |
          SMOKE="$RUNNER_TEMP/radar-sdist-smoke"
          mkdir -p "$SMOKE"
          python -m venv "$SMOKE/venv"
          "$SMOKE/venv/bin/python" -m pip install --no-deps setuptools==83.0.0
          "$SMOKE/venv/bin/python" -m pip install --no-deps --no-build-isolation "$RUNNER_TEMP"/radar-dist/*.tar.gz
          cd "$SMOKE"
          "$SMOKE/venv/bin/radar-bench" --version
          "$SMOKE/venv/bin/radar-bench" doctor
          "$SMOKE/venv/bin/radar-bench" list-suites
          set +e
          OUTPUT=$("$SMOKE/venv/bin/radar-bench" validate --suite decisive-v1.2 2>&1)
          CODE=$?
          set -e
          test "$CODE" -eq 2
          echo "$OUTPUT" | grep -q 'BLOCKED_INFORMATION_SUFFICIENCY'
      - name: Verify empty artifact roots fail closed
        shell: bash
        run: |
          SMOKE="$RUNNER_TEMP/radar-empty-artifacts"
          mkdir -p "$SMOKE"
          set +e
          OUTPUT=$(python -m radar_bench.cli artifacts verify --suite decisive-v1.1 --artifact-root "$SMOKE" 2>&1)
          CODE=$?
          set -e
          test "$CODE" -eq 4
          echo "$OUTPUT" | grep -q '"status": "BLOCKED"'
          ! echo "$OUTPUT" | grep -Eq 'FileNotFoundError|No such file'
      - name: Reconstruct and verify decisive v1.2 artifacts
        shell: bash
        run: |
          python -m radar_bench.cli artifacts fetch --suite decisive-v1.2 --output-root "$RUNNER_TEMP/radar-artifacts"
          python -m radar_bench.cli artifacts verify --suite decisive-v1.2 --artifact-root "$RUNNER_TEMP/radar-artifacts"
      - name: Run real external protocol experiment smoke
        run: python scripts/run_protocol_smoke.py --artifact-root "$RUNNER_TEMP/radar-artifacts" --output "$RUNNER_TEMP/protocol-smoke.json"
      - name: Upload protocol smoke receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/protocol-smoke.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify generators leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  security:
    name: Secret, metadata, and dependency policy scans
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked security dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Validate citation metadata
        run: |
          cffconvert --validate -i CITATION.cff
      - name: Build package archives for security scanning
        run: |
          python -m build --wheel --sdist --outdir "$RUNNER_TEMP/radar-dist"
          python scripts/prepare_release_assets.py --dist "$RUNNER_TEMP/radar-dist" --release-tag v1.1.1
          python scripts/audit_release_assets.py "$RUNNER_TEMP/radar-dist"
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
      - name: Scan current tree and reachable history with Gitleaks
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks-current.json"
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all' --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json"
      - name: Scan package archives with Gitleaks
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/radar-dist" --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks-package.json"
      - name: Install pinned TruffleHog
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/trufflehog.tar.gz"
          echo "7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP"
      - name: Scan tracked public tree with TruffleHog
        shell: bash
        run: |
          # URI/Lob are excluded only for documented inert URL/name fixtures.
          "$RUNNER_TEMP/trufflehog" filesystem . --json --no-update --no-color --results=verified --exclude-detectors=URI,Lob --fail --fail-on-scan-errors
      - name: Scan reachable history with TruffleHog
        shell: bash
        run: |
          # URI/Lob are excluded only for the inert credential-shaped test
          # fixtures retained to test URL rejection; Gitleaks scans them too.
          "$RUNNER_TEMP/trufflehog" git file://"$GITHUB_WORKSPACE" --json --no-update --no-color --results=verified --exclude-detectors=URI,Lob --fail --fail-on-scan-errors
      - name: Scan package archives with TruffleHog
        shell: bash
        run: |
          "$RUNNER_TEMP/trufflehog" filesystem "$RUNNER_TEMP/radar-dist" --json --no-update --no-color --results=verified --exclude-detectors=URI,Lob --fail --fail-on-scan-errors
